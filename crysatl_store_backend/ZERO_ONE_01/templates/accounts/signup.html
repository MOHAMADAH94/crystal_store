{% extends 'base.html' %}
{% load static %}

{% block title %}signup {% endblock %}
{% block contents  %}


    <div class="my-form container p-5 my-5 rounded border border-primary">


        <h2 class="text-center" style="color: var(--accent-cyan);">إنشاء حساب</h2>
            <hr style="border-color: var(--silver-light);">
        {% include 'partials/_alerts.html' %}
        {% if is_added == True %}
        <form method="POST" style="display: none;">
            {%else%}
            <form method="POST">
                {% endif %}
            
        
            {% csrf_token %}
            

            <div class="form-row">  
                <div class="form-group col-md-6">
                <div class="social-login my-4">




                    <label for="inputFirstName" class="fw-semibold" style="color: var(--accent-cyan);">الاسم الأول</label>
                    <input type="text"  class="form-control border-primary" id="inputFirstName" name="fname" required value="{{fname}}">
                </div>
                <div class="form-group col-md-6">
                    <label for="inputLastName" class="fw-semibold" style="color: var(--accent-cyan);">الاسم الأخير</label>
                    <input type="text" class="form-control border-primary" id="inputLastName" name="lname" required value="{{lname}}">
                </div>
            </div>

            <div class="form-group">
                <label for="inputAddress" class="fw-semibold" style="color: var(--accent-cyan);">العنوان</label>
                <input type="text" class="form-control border-primary" id="inputAddress" name="address"  placeholder="1234 Main St" required value="{{address}}">
            </div>
            <div class="form-group">
                <label for="inputAddress2" class="fw-semibold" style="color: var(--accent-cyan);">العنوان التفصيلي</label>
                <input type="text" class="form-control border-primary" id="inputAddress2" name="address2"  placeholder="Apartment, studio, or floor" required value="{{address2}}">
            </div>
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label for="inputCity" class="fw-semibold" style="color: var(--accent-cyan);">المدينة</label>
                    <input type="text" class="form-control border-primary" name="city"  id="inputCity" required value="{{city}}">
                </div>
                <div class="form-group col-md-4">
                    <label for="inputState" class="fw-semibold" style="color: var(--accent-cyan);">الدولة</label>
                    <input type="text" class="form-control border-primary" name="state"  id="inputstate" required value="{{state}}">
                </div>
                <div class="form-group col-md-4">
                    <label for="inputPhone" class="fw-semibold" style="color: var(--accent-cyan);">رقم الهاتف</label>
                    <input type="Phone" class="form-control border-primary" name="phone"  id="inputPhone" placeholder="00905526699018" required value="{{phone}}">
                </div>
            </div>
            <div class="form-group">
                <label for="inputEmail" class="fw-semibold" style="color: var(--accent-cyan);">البريد الالكتروني</label>
                <input type="email" class="form-control border-primary" id="inputEmail" name="email"  placeholder="name@example.com" required value="{{email}}">
            </div>
            
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="inputUsername" class="fw-semibold" style="color: var(--accent-cyan);">اسم المستخدم</label>
                    <input type="text" class="form-control border-primary" name="username"  id="inputUsername" placeholder="" required value="{{username}}">
                </div>
                <div class="form-group col-md-6">
                    <label for="inputPassword" class="fw-semibold" style="color: var(--accent-cyan);">كلمة المرور</label>
                    <input type="password" class="form-control border-primary"   name="password"  id="inputPassword" required value="{{password}}">
                </div>
                
            </div>
            <div class="form-row">
            <div class="form-group col-md-6">
                <label for="inputBalance" class="fw-semibold" style="color: var(--accent-cyan);">الرصيد</label>
                <input type="number" readonly class="form-control-plaintext border rounded" name="balance"  id="inputBalance" placeholder="0" value="{{balance}}" style="background-color: var(--bg-secondary); border-color: var(--silver-light) !important; color: var(--accent-gold);">
            </div>
            <div class="form-group col-md-6">
                <label for="inputLevel" class="fw-semibold" style="color: var(--accent-cyan);">المستوى</label>
                <input type="text" readonly class="form-control-plaintext border rounded" name="level"  id="inputLevel" placeholder="vip 1" value="{{level}}" style="background-color: var(--bg-secondary); border-color: var(--silver-light) !important; color: var(--text-muted);">
            </div>
            </div>
            <div class="form-row">
            <div class="form-group col-md-6">
                <label for="inputCurrency" class="fw-semibold" style="color: var(--accent-cyan);">العملة</label>
                <select class="form-control border-primary" name="currency" id="inputCurrency" required>
                    <option value="USD" {% if currency == 'USD' or not currency %}selected{% endif %}>دولار أمريكي (USD)</option>
                    <option value="SYP" {% if currency == 'SYP' %}selected{% endif %}>ليرة سورية (SYP)</option>
                </select>
            </div>
            </div>
            <br>
                        <!-- زر Google مفعّل -->
            <a href="{% url 'social:begin' 'google-oauth2' %}?next=/"
                class="btn btn-outline-danger w-100 mb-3 d-flex align-items-center justify-content-center"
                style="font-weight: 600;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1200px-Google_%22G%22_logo.svg.png" alt="Google Logo"
                    style="width: 20px; height: 20px; margin-left: 10px;">
                تسجيل الدخول باستخدام Google
            </a>

            <!-- زر Facebook غير مفعّل -->
            <button class="btn btn-outline-primary w-100 mb-3 d-flex align-items-center justify-content-center" disabled
                    style="font-weight: 600;">
                <img src="https://www.facebook.com/images/fb_icon_325x325.png" alt="Facebook Logo"
                    style="width: 20px; height: 20px; margin-left: 10px;">
                تسجيل الدخول باستخدام Facebook
            </button>

            <!-- زر Apple غير مفعّل -->
            <button class="btn btn-outline-dark w-100 d-flex align-items-center justify-content-center" disabled
                    style="font-weight: 600;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple Logo"
                    style="width: 20px; height: 20px; margin-left: 10px;">
                تسجيل الدخول باستخدام Apple
            </button>

            </div>
            </div>
<div class="form-group mb-4 d-flex align-items-center justify-content-start">
    <div class="d-flex align-items-center" style="gap: 8px;">
        <input type="checkbox" name="terms" id="inputTerms"
               style="width: 1.2em; height: 1.2em; border: 2px solid var(--accent-cyan); cursor: pointer;"
               {% if terms == 'on' %}checked{% endif %}>
        <label for="inputTerms" class="mb-0" style="cursor: pointer; color: var(--accent-cyan);">
            أوافق على شروط الاستخدام وسياسة الخصوصية
        </label>
    </div>
    
</div>



            <button name="btnsignup" type="submit" class="btn btn-primary">انشاء الحساب</button>
        </form>

    </div>






{% endblock %}

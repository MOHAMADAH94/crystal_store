{% extends 'base.html' %}
{% load static %}

{% block title %}التحقق من PIN{% endblock %}
{% block contents  %}

<div class="my-form container p-5 my-5 rounded border border-primary">
    
    <h2 class="text-center" style="font-weight: 700; color: var(--accent-cyan);">التحقق من رمز PIN</h2>
    
    <hr style="border-color: var(--silver-light);">
    
    <p class="text-center text-muted mb-4">يرجى إدخال رمز PIN للتحقق من هويتك</p>
    
    <form method="POST" id="pinForm">
        {% csrf_token %}
        
        {% include 'partials/_alerts.html' %}

        <div class="form-group mb-4">
            <label for="inputPin" class="fw-semibold d-block text-center mb-3" style="color: var(--accent-cyan); font-size: 1.1rem;">
                رمز PIN (4 أرقام)
            </label>
            <div class="d-flex justify-content-center gap-2 mb-3">
                <input type="text" 
                       class="form-control border-primary text-center" 
                       id="inputPin" 
                       name="pin" 
                       placeholder="----" 
                       maxlength="4" 
                       pattern="[0-9]{4}"
                       style="width: 200px; font-size: 1.5rem; letter-spacing: 0.5rem; font-weight: bold;"
                       required 
                       autocomplete="off"
                       autofocus>
            </div>
            <small class="text-muted d-block text-center">أدخل 4 أرقام فقط</small>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary w-100" style="font-weight: 600; padding: 12px;">
                <i class="fas fa-lock me-2"></i>
                التحقق من PIN
            </button>
        </div>
    </form>
</div>

<script>
    // تقييد الإدخال على الأرقام فقط
    document.getElementById('inputPin').addEventListener('input', function(e) {
        // إزالة أي شيء غير رقم
        this.value = this.value.replace(/[^0-9]/g, '');
        
        // تحديد الحد الأقصى إلى 4 أرقام
        if (this.value.length > 4) {
            this.value = this.value.slice(0, 4);
        }
    });

    // منع إدخال أي شيء غير رقم
    document.getElementById('inputPin').addEventListener('keypress', function(e) {
        // السماح فقط بالأرقام
        if (!/[0-9]/.test(e.key) && !['Backspace', 'Delete', 'Tab', 'Enter'].includes(e.key)) {
            e.preventDefault();
        }
    });

    // التركيز التلقائي على حقل PIN عند تحميل الصفحة
    window.addEventListener('load', function() {
        document.getElementById('inputPin').focus();
    });
</script>

<style>
    #inputPin:focus {
        border-color: var(--purple);
        box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.25);
        outline: none;
    }
</style>

{% endblock %}
